name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 20
            codeceptjs-version: 3.7.9
          - node-version: 24
            codeceptjs-version: 4.2.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - if: matrix.codeceptjs-version == '4.2.0'
        run: npm ci
      - if: matrix.codeceptjs-version != '4.2.0'
        run: npm ci --omit=dev
      - if: matrix.codeceptjs-version != '4.2.0'
        run: npm install --no-save codeceptjs@${{ matrix.codeceptjs-version }}
      - run: npm test
